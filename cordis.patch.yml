# dsh-opencode-free DSH plugin — bundle patch: insert the plugin row (deployment-global).
#
# The plugin itself is distributed as the npm package @dsh-opencode-free/dsh-plugin
# (declared in dependencies); this patch only inserts its loader row.
# Defaults need no edits: the adapter registers into dsh-llm with no key and
# no extra process. Override any option via the config object (src/config.ts).
- insert:
    - id: dsh-opencode-free
      name: '@dsh-opencode-free/dsh-plugin'
      config: {}
