# dsh-opencode-free DSH plugin — bundle patch: insert the plugin row (deployment-global).
#
# `name` must be the package this repository installs as. The root package.json
# is that package: a `github:ddldxiacan/dsh-opencode-free` install produces the
# dependency `dsh-opencode-free`, and prebuilt output ships in
# packages/plugin/lib, so no build step runs on install.
#
# Defaults need no edits: the adapter registers into dsh-llm with no key and no
# extra process. Override any option via the config object (src/config.ts).
- insert:
    - id: dsh-opencode-free
      name: 'dsh-opencode-free'
      config: {}
