# only remaining gate is the registry's 1-day repository-age rule: created
# 2026-10-19, so submit on or after 2026-10-20.
#
# Lineage: this project was renamed from its fork name `opencode2dsh` to
# `dsh-opencode-free`. The upstream project is FishBottle7/opencode2dsh, which
# already has a registry entry installing its published npm build. The case for
# this entry is that it is independently maintained and carries fixes the
