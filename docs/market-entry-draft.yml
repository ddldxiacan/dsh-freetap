#
# Target registry: https://github.com/awesome-dsh-plugin/awesome-dsh-plugin
# Path to add: data/plugins/ddldxiacan__dsh-opencode-free--packages-plugin.yml
#   Monorepo form, following contributing.md ("owner/repo#subname", filename
#   owner__repo--packages-plugin). The url MUST point at the subdirectory: the
#   repository root is a wrapper whose dependency installs the plugin, so a root
#   entry would not name the installable unit.
#
# tarball: version-free asset name on purpose — `latest/download/` resolves
# `latest` at request time but takes the filename literally, so a versioned asset
# name works on submission day and 404s on the next release. It is also the
# smoother install path, because this repo does not commit packages/plugin/lib/,
# so a source install would hit pnpm's build-approval step
# (ERR_PNPM_GIT_DEP_PREPARE_NOT_ALLOWED).
#
# The description stays a claim the registry checks against the code — no
# superlatives, no numbers that are not true of the tree.

