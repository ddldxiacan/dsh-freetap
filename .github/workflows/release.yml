name: Release

# Cut a release by pushing a tag. The tag is the single source of truth for the
# version: it is written into packages/plugin/package.json and the root
# package.json before building, so the two never drift.
#
#   git tag v0.4.2 && git push origin v0.4.2
#
# Artifacts produced:
#   - packages/plugin/lib/ committed back to master (keeps `github:` installs working)
#   - GitHub Release with two names for the same tarball:
#       dsh-freetap.tgz            (version-free: first install)
#       dsh-freetap-<version>.tgz  (tag-scoped: the update path)

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/plugin/pnpm-lock.yaml

      - name: Resolve version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a semantic version (expected vX.Y.Z)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION"

      - name: Install
        working-directory: packages/plugin
        run: pnpm install --frozen-lockfile

      - name: Write version into both manifests
        run: |
          node -e '
            const fs = require("node:fs");
            const version = process.env.VERSION;
            for (const file of ["package.json", "packages/plugin/package.json"]) {
              const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
              manifest.version = version;
              fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");
            }
          '
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Typecheck
        working-directory: packages/plugin
        run: pnpm typecheck

      - name: Test
        working-directory: packages/plugin
        run: pnpm test

      - name: Build (server + client)
        working-directory: packages/plugin
        run: |
          pnpm build
          pnpm build:client
          node ../../scripts/prepare-package.mjs

      - name: Pack
        working-directory: packages/plugin
        run: |
          npm pack
          # TWO asset names, both cut from the same tarball:
          #
          #  * a version-free name, so releases/latest/download/<name> stays a
          #    stable bookmark for first installs, and
          #  * a VERSIONED name, because that is the only one an existing
          #    install can actually update from. pnpm resolves a tarball URL
          #    once and then pins it in pnpm-lock.yaml together with its
          #    integrity hash: re-adding the same URL is a no-op ("Lockfile is
          #    up to date, resolution step is skipped") even with --force, so
          #    `dsh plugin add .../releases/latest/download/<same-name>.tgz`
          #    silently kept the OLD version forever. A tag-scoped URL differs
          #    each release, so pnpm resolves it and the update lands.
          npm_tgz="$(ls ./*.tgz)"
          cp "${npm_tgz}" "${RUNNER_TEMP}/dsh-freetap.tgz"
          cp "${npm_tgz}" "${RUNNER_TEMP}/dsh-freetap-${{ steps.version.outputs.version }}.tgz"
          ls -la "${RUNNER_TEMP}"/*.tgz

      - name: Commit the prebuilt output and version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only the tracked artifacts matter. The README/LICENSE copies that
          # prepare-package.mjs writes into packages/plugin are gitignored, so
          # naming them here would either be a no-op or an error.
          git add package.json packages/plugin/package.json packages/plugin/lib

          if git diff --cached --quiet; then
            echo "Nothing to commit; master already carries this build."
            exit 0
          fi

          git commit -m "chore(release): v${{ steps.version.outputs.version }}"

          # The tag checkout is a detached HEAD based on the tagged commit, which
          # may be behind master. Rebase onto master before pushing, so the
          # version bump and build land on top of the current branch rather than
          # being rejected as non-fast-forward.
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: dsh-freetap v${{ steps.version.outputs.version }}
          files: |
            ${{ runner.temp }}/dsh-freetap.tgz
            ${{ runner.temp }}/dsh-freetap-${{ steps.version.outputs.version }}.tgz
          generate_release_notes: true
          fail_on_unmatched_files: true

      # npm is optional: the package is unscoped, so publishing only needs an
      # NPM_TOKEN secret with publish rights. Absent is normal, so this step
      # reports and skips instead of failing the release — the release tarball
      # and the git install already work without a registry.
      #
      # A token must be a Granular Access Token with "Bypass 2FA" enabled:
      # since npm tightened publishing, a classic/2FA-bound token is refused
      # with a bare 403 on PUT. That refusal is reported as an error here
      # rather than swallowed, because silently not publishing is exactly the
      # failure mode this job exists to prevent.
      - name: Publish to npm
        id: npm
        working-directory: packages/plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is not configured; skipping npm publish."
            echo "The Release tarball and github: install remain the supported paths."
            exit 0
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" > .npmrc
          VERSION="$(node -p 'require("./package.json").version')"
          set +e
          OUT="$(npm publish --access public 2>&1)"
          STATUS=$?
          rm -f .npmrc
          set -e
          printf '%s\n' "$OUT"

          if [ $STATUS -eq 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only "this exact version is already published" may be tolerated.
          # A 403 (token lacks Bypass 2FA) must fail: a green job that shipped
          # no registry version is the failure mode this step exists to catch.
          if printf '%s' "$OUT" | grep -q "cannot publish over the previously published versions: ${VERSION}"; then
            echo "::notice::${VERSION} is already on the registry; nothing to publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if printf '%s' "$OUT" | grep -qE 'E403|bypass 2fa|Two-factor'; then
            echo "::error::npm refused to publish (403). NPM_TOKEN must be a Granular Access Token with 'Bypass 2FA' enabled."
          elif printf '%s' "$OUT" | grep -qE 'E401|ENEEDAUTH'; then
            echo "::error::npm rejected the token (401). NPM_TOKEN is missing, revoked, or expired."
          else
            echo "::error::npm publish failed with exit code ${STATUS}"
          fi
          exit $STATUS

      # The registry is the install path most users take, so a release that did
      # not reach it must fail the run rather than pass quietly.
      - name: Fail when the registry did not receive this version
        if: steps.npm.outputs.published != 'true'
        run: |
          echo "::error::This release did NOT publish to npm (see the Publish to npm step). 'dsh plugin add dsh-freetap' will keep serving the previous version."
          exit 1
