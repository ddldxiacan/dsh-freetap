name: Release

# Cut a release by pushing a tag. The tag is the single source of truth for the
# version: it is written into packages/plugin/package.json and the root
# package.json before building, so the two never drift.
#
#   git tag v0.4.1 && git push origin v0.4.1
#
# Artifacts produced:
#   - packages/plugin/lib/ committed back to master (keeps `github:` installs working)
#   - GitHub Release with dsh-opencode-free-dsh-plugin.tgz (version-free asset name)

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/plugin/pnpm-lock.yaml

      - name: Resolve version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not a semantic version (expected vX.Y.Z)."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION"

      - name: Install
        working-directory: packages/plugin
        run: pnpm install --frozen-lockfile

      - name: Write version into both manifests
        run: |
          node -e '
            const fs = require("node:fs");
            const version = process.env.VERSION;
            for (const file of ["package.json", "packages/plugin/package.json"]) {
              const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
              manifest.version = version;
              fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");
            }
          '
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Typecheck
        working-directory: packages/plugin
        run: pnpm typecheck

      - name: Test
        working-directory: packages/plugin
        run: pnpm test

      - name: Build (server + client)
        working-directory: packages/plugin
        run: |
          pnpm build
          pnpm build:client
          node ../../scripts/prepare-package.mjs

      - name: Pack
        working-directory: packages/plugin
        run: |
          npm pack
          # A version-free asset name keeps releases/latest/download/<name> valid
          # across releases; the asset is replaced each time.
          mv ./*.tgz "${RUNNER_TEMP}/dsh-opencode-free-dsh-plugin.tgz"
          ls -la "${RUNNER_TEMP}/dsh-opencode-free-dsh-plugin.tgz"

      - name: Commit the prebuilt output and version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only the tracked artifacts matter. The README/LICENSE copies that
          # prepare-package.mjs writes into packages/plugin are gitignored, so
          # naming them here would either be a no-op or an error.
          git add package.json packages/plugin/package.json packages/plugin/lib

          if git diff --cached --quiet; then
            echo "Nothing to commit; master already carries this build."
            exit 0
          fi

          git commit -m "chore(release): v${{ steps.version.outputs.version }}"

          # The tag checkout is a detached HEAD based on the tagged commit, which
          # may be behind master. Rebase onto master before pushing, so the
          # version bump and build land on top of the current branch rather than
          # being rejected as non-fast-forward.
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: dsh-opencode-free v${{ steps.version.outputs.version }}
          files: ${{ runner.temp }}/dsh-opencode-free-dsh-plugin.tgz
          generate_release_notes: true
          fail_on_unmatched_files: true

      # npm is optional: it needs the @dsh-opencode-free scope to exist and an
      # NPM_TOKEN secret with publish rights. Both absent is normal, so this step
      # reports and skips instead of failing the release — the release tarball
      # and the git install already work without a registry.
      - name: Publish to npm
        working-directory: packages/plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN is not configured; skipping npm publish."
            echo "The Release tarball and github: install remain the supported paths."
            exit 0
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" > .npmrc
          npm publish --access public
          rm -f .npmrc
